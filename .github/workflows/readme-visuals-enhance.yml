name: Enhance README visuals

on:
  push:
    branches:
      - main
    paths:
      - "tools/enhance_readme_visuals.py"
      - ".github/workflows/readme-visuals-enhance.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate second-pass README graphics
        run: python tools/enhance_readme_visuals.py

      - name: Commit enhanced visuals and README changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/readme/*.svg
          if git diff --cached --quiet; then
            echo "No enhanced README visual changes to commit."
            exit 0
          fi
          git commit -m "Enhance README with custom project graphics"
          git push
