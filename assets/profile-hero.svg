<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Bradley Matera — Developer</title>
  <desc id="desc">Animated developer profile banner with moving gradient, code lines, and connected nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#07111f">
        <animate attributeName="stop-color" values="#07111f;#101638;#07111f" dur="9s" repeatCount="indefinite"/>
      </stop>
      <stop offset="48%" stop-color="#102a56">
        <animate attributeName="stop-color" values="#102a56;#173b68;#102a56" dur="11s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#28104f">
        <animate attributeName="stop-color" values="#28104f;#123f61;#28104f" dur="13s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.5" stop-color="#7ee787"/>
      <stop offset="1" stop-color="#d2a8ff"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8b949e" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <circle cx="1050" cy="75" r="220" fill="url(#glow)">
    <animate attributeName="cx" values="1050;960;1050" dur="10s" repeatCount="indefinite"/>
  </circle>
  <circle cx="105" cy="315" r="180" fill="url(#glow)" opacity="0.45">
    <animate attributeName="cy" values="315;260;315" dur="12s" repeatCount="indefinite"/>
  </circle>

  <g opacity="0.75" fill="none" stroke="#58a6ff" stroke-width="2">
    <path d="M830 92 C900 45 965 160 1040 105 S1140 90 1175 132" stroke-dasharray="7 10">
      <animate attributeName="stroke-dashoffset" values="0;-68" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M785 252 C860 205 930 330 1005 260 S1115 238 1170 285" stroke="#d2a8ff" stroke-dasharray="5 11">
      <animate attributeName="stroke-dashoffset" values="0;64" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <g filter="url(#softGlow)">
    <circle cx="858" cy="79" r="5" fill="#58a6ff"><animate attributeName="r" values="4;7;4" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="945" cy="126" r="5" fill="#7ee787"><animate attributeName="r" values="5;8;5" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="1050" cy="104" r="5" fill="#d2a8ff"><animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="1125" cy="111" r="5" fill="#58a6ff"><animate attributeName="r" values="5;8;5" dur="3.8s" repeatCount="indefinite"/></circle>
    <circle cx="820" cy="237" r="5" fill="#7ee787"><animate attributeName="r" values="5;8;5" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="924" cy="282" r="5" fill="#58a6ff"><animate attributeName="r" values="4;7;4" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="1020" cy="253" r="5" fill="#d2a8ff"><animate attributeName="r" values="5;8;5" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="1122" cy="264" r="5" fill="#7ee787"><animate attributeName="r" values="4;7;4" dur="3s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="66" y="92" fill="#8b949e" font-size="18">$ whoami</text>
    <text x="66" y="150" fill="#f0f6fc" font-size="48" font-weight="700">Bradley Matera</text>
    <rect x="66" y="169" width="480" height="4" rx="2" fill="url(#accent)">
      <animate attributeName="width" values="180;480;180" dur="7s" repeatCount="indefinite"/>
    </rect>
    <text x="66" y="218" fill="#58a6ff" font-size="29" font-weight="600">Developer</text>
    <text x="66" y="260" fill="#c9d1d9" font-size="20">I turn ideas into complete, usable software experiences.</text>
    <text x="66" y="303" fill="#7ee787" font-size="17">web  •  cloud  •  automation  •  support  •  AI-assisted development</text>
  </g>

  <g transform="translate(865 150)" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">
    <rect x="0" y="0" width="275" height="115" rx="12" fill="#0d1117" fill-opacity="0.72" stroke="#30363d"/>
    <circle cx="20" cy="19" r="5" fill="#ff7b72"/><circle cx="38" cy="19" r="5" fill="#d29922"/><circle cx="56" cy="19" r="5" fill="#7ee787"/>
    <text x="18" y="54" fill="#8b949e">idea</text><text x="64" y="54" fill="#58a6ff">→</text><text x="84" y="54" fill="#c9d1d9">build</text>
    <text x="18" y="80" fill="#8b949e">build</text><text x="64" y="80" fill="#58a6ff">→</text><text x="84" y="80" fill="#c9d1d9">test</text>
    <text x="18" y="106" fill="#8b949e">test</text><text x="64" y="106" fill="#58a6ff">→</text><text x="84" y="106" fill="#7ee787">ship</text>
    <rect x="122" y="94" width="8" height="15" fill="#7ee787"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>
</svg>