  </defs><rect x="1" y="1" width="898" height="72" rx="18" fill="#0d1117" stroke="#30363d" stroke-width="2"/><rect x="1" y="1" width="898" height="72" rx="18" fill="url(#grid)" opacity="0.45"/><circle cx="31" cy="37" r="6" fill="#7ee787" filter="url(#softGlow)"><animate attributeName="opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="52" y="43" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="16">pipeline://</text><g font-family="ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace" font-size="18" font-weight="700"><text x="165" y="43" fill="#58a6ff">IDEA</text><text x="224" y="43" fill="#8b949e">&gt;</text><text x="250" y="43" fill="#f0f6fc">BUILD</text><text x="320" y="43" fill="#8b949e">&gt;</text><text x="346" y="43" fill="#d2a8ff">TEST</text><text x="405" y="43" fill="#8b949e">&gt;</text><text x="431" y="43" fill="#7ee787">SHIP</text><text x="490" y="43" fill="#8b949e">&gt;</text><text x="516" y="43" fill="#ffb86b">LEARN</text></g><path d="M628 37H855" stroke="url(#accent)" stroke-width="3" stroke-dasharray="8 11"><animate attributeName="stroke-dashoffset" values="0;-76" dur="3s" repeatCount="indefinite"/></path><circle cx="855" cy="37" r="5" fill="#58a6ff"><animate attributeName="r" values="3;7;3" dur="2.4s" repeatCount="indefinite"/></circle></svg>